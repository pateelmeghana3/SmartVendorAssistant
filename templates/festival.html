<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Festival Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>🎉 Festival Management</h2>

<form method="POST" class="row g-3 mt-3">

<div class="col-md-5">
<input
type="text"
name="festival_name"
class="form-control"
placeholder="Festival Name"
required>
</div>

<div class="col-md-4">
<input
type="date"
name="festival_date"
class="form-control"
required>
</div>

<div class="col-md-3">
<button class="btn btn-success w-100">
Add Festival
</button>
</div>

</form>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Festival</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for festival in festivals %}

<tr>

<td>{{ festival.id }}</td>

<td>{{ festival.festival_name }}</td>

<td>{{ festival.festival_date }}</td>

<td>

<a
href="/delete_festival/{{ festival.id }}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
